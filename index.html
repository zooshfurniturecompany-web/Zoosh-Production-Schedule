<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOOSH PRODUCTION — Modern Factory Control Room</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/gantt.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
      <div class="brand-header">
        <div class="brand-icon">Z</div>
        <div class="brand-text">
          <h1>Zoosh Production</h1>
          <span>Factory Control Room</span>
        </div>
      </div>

      <ul class="nav-links">
        <li>
          <a class="nav-item active" data-view="overview" href="#overview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="3" width="7" height="9" rx="1"/>
              <rect x="14" y="3" width="7" height="5" rx="1"/>
              <rect x="14" y="12" width="7" height="9" rx="1"/>
              <rect x="3" y="16" width="7" height="5" rx="1"/>
            </svg>
            Overview
          </a>
        </li>
        <li>
          <a class="nav-item" data-view="projects" href="#projects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            Projects
          </a>
        </li>
        <li>
          <a class="nav-item" data-view="schedule" href="#schedule">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            Production Schedule
          </a>
        </li>
        <li>
          <a class="nav-item" data-view="team" href="#team">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Team
          </a>
        </li>
        <li>
          <a class="nav-item" data-view="processes" href="#processes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Production Processes
          </a>
        </li>
        <li>
          <a class="nav-item" data-view="manpower" href="#manpower">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
            Manpower
          </a>
        </li>
        <li>
          <a class="nav-item" data-view="reports" href="#reports">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            Reports
          </a>
        </li>
      </ul>

      <!-- Data & Persistence Footer -->
      <div class="sidebar-footer">
        <div class="data-controls-label">Database &amp; Data Control</div>
        <div class="data-actions-row">
          <button class="btn-data-action" onclick="window.Zoosh.App.exportJson()" title="Download JSON backup">
            <span>📥</span> Export
          </button>
          <button class="btn-data-action" onclick="window.Zoosh.App.triggerImport()" title="Restore from JSON">
            <span>📤</span> Import
          </button>
          <button class="btn-data-action" onclick="window.Zoosh.App.resetDemoData()" title="Reload demo dataset">
            <span>🔄</span> Demo
          </button>
          <button class="btn-data-action" onclick="window.Zoosh.App.startFresh()" title="Clear factory orders">
            <span>🗑️</span> Fresh
          </button>
        </div>
        <input type="file" id="import-file-input" accept=".json" style="display: none;" />
      </div>
    </aside>

    <!-- Main View Area -->
    <main class="app-main">
      <!-- Mobile Compact Topbar (<768px) -->
      <header class="mobile-topbar" id="mobile-topbar-el">
        <div class="mobile-topbar-left">
          <button id="mobile-back-btn" class="mobile-back-btn" style="display: none;" onclick="window.Zoosh.App.handleMobileBack()">
            &larr;
          </button>
          <div class="mobile-topbar-title" id="mobile-topbar-title">Zoosh Production</div>
        </div>
        <div class="mobile-topbar-right">
          <span id="mobile-cloud-badge" class="badge badge-on-schedule" style="font-size: 10px; padding: 2px 6px; cursor: pointer;" onclick="window.Zoosh.CloudSync.openConfigModal()">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block;"></span>
            <span>Cloud</span>
          </span>
          <button class="btn btn-accent btn-sm" style="padding: 4px 8px; font-size: 11px;" onclick="window.Zoosh.AddSrlWizard.open()">
            + SRL
          </button>
        </div>
      </header>

      <!-- Desktop Top Control Bar (>768px) -->
      <header class="control-topbar desktop-only">
        <div class="topbar-left">
          <div class="date-badge">
            <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981;"></span>
            <span>Monday, 28 September 2026</span>
          </div>
          <span id="cloud-sync-badge" class="badge badge-at-risk" style="cursor: pointer;" onclick="window.Zoosh.CloudSync.openConfigModal()">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; display: inline-block;"></span>
            <span>Local Mode (Connect Cloud)</span>
          </span>
          <span id="topbar-alerts-count" class="badge badge-at-risk" style="display: none; cursor: pointer;" onclick="window.Zoosh.App.navigateTo('overview')">
            0 alerts
          </span>
        </div>

        <div class="topbar-right">
          <button class="btn btn-secondary btn-sm" onclick="window.Zoosh.Views.Projects.openAddModal()">
            + New Project
          </button>
          <button class="btn btn-accent btn-sm" onclick="window.Zoosh.AddSrlWizard.open()">
            + Add Furniture / SRL
          </button>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <div class="view-viewport" id="view-container">
        <!-- Rendered by active view controller -->
      </div>
    </main>

    <!-- Mobile Fixed Bottom Navigation Bar (<768px) -->
    <nav class="mobile-bottom-nav">
      <button class="mobile-nav-btn active" data-view="overview" onclick="window.Zoosh.App.navigateTo('overview')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="7" height="9" rx="1"/>
          <rect x="14" y="3" width="7" height="5" rx="1"/>
          <rect x="14" y="12" width="7" height="9" rx="1"/>
          <rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg>
        <span>Overview</span>
      </button>

      <button class="mobile-nav-btn" data-view="projects" onclick="window.Zoosh.App.navigateTo('projects')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Projects</span>
      </button>

      <button class="mobile-nav-btn" data-view="schedule" onclick="window.Zoosh.App.navigateTo('schedule')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Schedule</span>
      </button>

      <button class="mobile-nav-btn" data-view="team" onclick="window.Zoosh.App.navigateTo('team')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Team</span>
      </button>

      <button class="mobile-nav-btn" data-view="manpower" onclick="window.Zoosh.App.navigateTo('manpower')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
        <span>Manpower</span>
      </button>
    </nav>
  </div>

  <!-- Global Modal Mount -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div id="modal-container" class="modal-dialog"></div>
  </div>

  <!-- Supabase JS Client (for real-time multi-user sync) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Application Scripts -->
  <script src="js/config.js"></script>
  <script src="js/data/demoData.js"></script>
  <script src="js/engine/calendar.js"></script>
  <script src="js/engine/scheduler.js"></script>
  <script src="js/engine/allocator.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/state.js"></script>
  
  <script src="js/components/modal.js"></script>
  <script src="js/components/addSrlWizard.js"></script>
  <script src="js/components/reallocateModal.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/projects.js"></script>
  <script src="js/views/schedule.js"></script>
  <script src="js/views/team.js"></script>
  <script src="js/views/processes.js"></script>
  <script src="js/views/manpower.js"></script>
  <script src="js/views/reports.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
